name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18

      # quarto-live still needs a Jupyter kernel at render time even though code runs in WASM
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python environment
        run: uv sync --frozen

      # _extensions/ is gitignored, so install quarto-live fresh (same as README setup)
      - name: Install quarto-live extension
        run: quarto add r-wasm/quarto-live --no-prompt

      - name: Render site
        run: uv run quarto render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
